<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Medical Assistant — Patient</title>
<style>
  :root { --blue:#2E6DA4; --bg:#f4f7fb; --bot:#e9eef6; --me:#d6ead6; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Segoe UI",Tahoma,Arial,sans-serif; background:var(--bg);
         color:#1a1a1a; }
  .wrap { max-width:680px; margin:0 auto; height:100vh; display:flex; flex-direction:column; }
  header { background:var(--blue); color:#fff; padding:14px 18px; display:flex; align-items:center; }
  header div { flex:1; }
  header h1 { margin:0; font-size:18px; }
  header p { margin:4px 0 0; font-size:12px; opacity:.85; }
  header button { background:rgba(255,255,255,.2); color:#fff; border:0; border-radius:7px;
                  padding:7px 12px; cursor:pointer; font-size:13px; }
  /* auth */
  #auth { flex:1; display:flex; align-items:center; justify-content:center; padding:20px; }
  .card { background:#fff; border:1px solid #e2e8f0; border-radius:14px; padding:26px; width:340px;
          box-shadow:0 6px 24px rgba(0,0,0,.06); }
  .card h2 { margin:0 0 4px; font-size:20px; } .card .sub { color:#667; font-size:13px; margin-bottom:18px; }
  .tabs { display:flex; margin-bottom:16px; border:1px solid #d7e0ea; border-radius:9px; overflow:hidden; }
  .tabs button { flex:1; border:0; padding:9px; background:#fff; cursor:pointer; font-size:14px; }
  .tabs button.on { background:var(--blue); color:#fff; }
  .card label { display:block; font-size:13px; color:#445; margin:10px 0 4px; }
  .card input { width:100%; padding:11px 12px; border:1px solid #cfd8e3; border-radius:9px; font-size:15px; }
  .card .go { width:100%; margin-top:18px; padding:12px; border:0; border-radius:9px;
              background:var(--blue); color:#fff; font-size:15px; cursor:pointer; }
  .err { color:#b02a37; font-size:13px; margin-top:10px; min-height:18px; }
  /* chat */
  #app { flex:1; display:none; flex-direction:column; min-height:0; }
  #chat { flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:78%; padding:10px 13px; border-radius:14px; line-height:1.5; white-space:pre-wrap; }
  .bot { background:var(--bot); align-self:flex-start; border-bottom-left-radius:4px; }
  .me  { background:var(--me);  align-self:flex-end;   border-bottom-right-radius:4px; }
  .banner { align-self:center; background:#fff3cd; border:1px solid #e0c75a; color:#6b5900;
            padding:10px 14px; border-radius:10px; font-size:13px; text-align:center; }
  .sys { align-self:center; font-size:12px; color:#666; }
  form#chatform { display:flex; gap:8px; padding:12px; border-top:1px solid #e2e8f0; background:#fff; }
  #text { flex:1; padding:11px 13px; border:1px solid #cfd8e3; border-radius:10px; font-size:15px; }
  #send { padding:11px 18px; border:0; border-radius:10px; background:var(--blue); color:#fff;
          font-size:15px; cursor:pointer; }
  #send:disabled { opacity:.5; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Medical Assistant</h1>
      <p>A preliminary assessment to confirm with a clinician</p>
    </div>
    <button id="logout" style="display:none" onclick="logout()">Log out</button>
  </header>

  <!-- login / register -->
  <div id="auth">
    <div class="card">
      <h2 id="title">Sign in</h2>
      <div class="sub">to your patient account</div>
      <div class="tabs">
        <button id="tabLogin" class="on" onclick="mode('login')">Login</button>
        <button id="tabReg" onclick="mode('register')">Register</button>
      </div>
      <div id="nameRow" style="display:none">
        <label>Full name</label><input id="name" autocomplete="name">
      </div>
      <label>Username</label>
      <input id="username" autocomplete="username">
      <label>Password</label>
      <input id="password" type="password" autocomplete="current-password">
      <button class="go" id="go" onclick="submit()">Continue</button>
      <div class="err" id="err"></div>
    </div>
  </div>

  <!-- chat -->
  <div id="app">
    <div id="chat"></div>
    <form id="chatform" autocomplete="off">
      <input id="text" type="text" placeholder="Type here…">
      <button id="send" type="submit">Send</button>
    </form>
  </div>
</div>

<script>
let authMode = 'login';
let sessionId = null;
const $ = id => document.getElementById(id);

function mode(m){
  authMode = m;
  $('tabLogin').classList.toggle('on', m==='login');
  $('tabReg').classList.toggle('on', m==='register');
  $('nameRow').style.display = m==='register' ? 'block' : 'none';
  $('title').textContent = m==='register' ? 'Create account' : 'Sign in';
  $('err').textContent = '';
}

async function submit(){
  const username = $('username').value.trim();
  const password = $('password').value;
  const name = $('name').value.trim();
  if (!username || !password){ $('err').textContent = 'Username and password are required.'; return; }
  const url = authMode==='register' ? '/patient/register' : '/patient/login';
  try {
    const r = await fetch(url, { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ username, password, name }) });
    if (!r.ok){ const j = await r.json().catch(()=>({}));
      $('err').textContent = j.detail || ('Failed ('+r.status+')'); return; }
    const j = await r.json();
    localStorage.setItem('patient_token', j.token);
    await openChat();
  } catch(e){ $('err').textContent = 'Could not reach the server.'; }
}

function add(role, content){
  const d = document.createElement('div');
  d.className = 'msg ' + (role==='me'?'me':'bot'); d.textContent = content;
  $('chat').appendChild(d); $('chat').scrollTop = $('chat').scrollHeight;
  return d;
}
function banner(t){ const d=document.createElement('div'); d.className='banner'; d.textContent=t;
  $('chat').appendChild(d); $('chat').scrollTop=$('chat').scrollHeight; }

async function openChat(){
  const token = localStorage.getItem('patient_token');
  const r = await fetch('/patient/consultations', { method:'POST',
    headers:{'Content-Type':'application/json','X-Patient-Token': token } });
  if (r.status === 401){ logout(); return; }                 // token expired (e.g. server restart)
  const j = await r.json();
  sessionId = j.session_id;
  $('auth').style.display = 'none';
  $('app').style.display = 'flex';
  $('logout').style.display = 'inline-block';
  $('chat').innerHTML = '';
  add('bot', j.reply); $('text').focus();
}

function logout(){
  localStorage.removeItem('patient_token'); sessionId = null;
  $('app').style.display = 'none'; $('logout').style.display = 'none';
  $('auth').style.display = 'flex'; $('err').textContent = '';
}

// Streaming turn: read NDJSON chunks and render the reply AS IT IS GENERATED, so the
// patient sees the first words immediately instead of waiting for the whole turn.
async function sendStreaming(m){
  const r = await fetch('/patient/consultations/'+sessionId+'/messages/stream', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ message: m }) });
  if (!r.ok || !r.body) throw new Error('stream unavailable ('+r.status+')');
  const bubble = add('bot', '…');                 // placeholder until the first chunk arrives
  let started = false, buf = '';
  const reader = r.body.getReader(), dec = new TextDecoder();
  try {
    while (true){
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream:true });
      let nl;
      while ((nl = buf.indexOf('\n')) >= 0){
        const line = buf.slice(0, nl).trim(); buf = buf.slice(nl+1);
        if (!line) continue;
        const j = JSON.parse(line);
        if (j.delta !== undefined){
          if (!started){ bubble.textContent = ''; started = true; }
          bubble.textContent += j.delta;
          $('chat').scrollTop = $('chat').scrollHeight;
        } else if (j.done && j.complete){
          banner("Your assessment is ready and has been sent to a doctor for review.");
        }
      }
    }
  } finally {
    if (!started) bubble.textContent = "Network error — please try again.";
  }
}

// Non-streaming fallback (the original endpoint) — used if the stream fails to start.
async function sendPlain(m){
  const r = await fetch('/patient/consultations/'+sessionId+'/messages', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ message: m }) });
  const j = await r.json();
  add('bot', j.reply);
  if (j.complete) banner("Your assessment is ready and has been sent to a doctor for review.");
}

$('chatform').addEventListener('submit', async (e) => {
  e.preventDefault();
  const m = $('text').value.trim();
  if (!m || !sessionId) return;
  add('me', m); $('text').value=''; $('send').disabled = true;
  try {
    await sendStreaming(m);
  } catch(_) {
    try { await sendPlain(m); }
    catch(e){ add('bot', "Network error — please try again."); }
  }
  $('send').disabled = false; $('text').focus();
});

// auto-resume if a token is already stored
if (localStorage.getItem('patient_token')) openChat();
</script>
</body>
</html>
